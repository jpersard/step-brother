name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Laufende Builds nicht abbrechen: Der erste Lauf baut OCCT ueber eine Stunde lang und
# fuellt dabei den Cache. Neue Pushes warten, bis er fertig ist.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            preset: windows-msvc
            triplet: x64-windows-release
            toolchain: msvc
          - name: clang-cl
            preset: windows-clang-cl
            triplet: x64-windows-clangcl-release
            toolchain: msvc
          - name: MinGW
            preset: windows-mingw
            triplet: x64-mingw-dynamic-release
            toolchain: mingw

    env:
      # Absolute Pfade ausserhalb des Arbeitsordners (actions/cache erlaubt kein "..")
      VCPKG_ROOT: D:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: D:\vcpkg-bincache
      VCPKG_DISABLE_METRICS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: MSVC-Umgebung
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: VCPKG_ROOT zuruecksetzen
        # Die VS-Umgebung zeigt VCPKG_ROOT auf das vcpkg von Visual Studio - wir wollen unseres.
        if: matrix.toolchain == 'msvc'
        run: Add-Content $env:GITHUB_ENV "VCPKG_ROOT=D:\vcpkg"

      - name: MSYS2 / MinGW-w64 (UCRT64)
        if: matrix.toolchain == 'mingw'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: MinGW in PATH
        if: matrix.toolchain == 'mingw'
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          Add-Content $env:GITHUB_PATH $bin
          & (Join-Path $bin 'g++.exe') --version

      - name: vcpkg holen (Commit aus vcpkg.json)
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout --quiet $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: vcpkg-Cache wiederherstellen
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/toolchains/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: Konfigurieren (baut beim ersten Mal OCCT, ca. 1-2 h)
        run: cmake --preset ${{ matrix.preset }}

      - name: vcpkg-Logs bei Fehler ausgeben
        if: failure()
        run: |
          Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Include *.log -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'err|out|detect|config' } |
            Sort-Object LastWriteTime | Select-Object -Last 8 | ForEach-Object {
              Write-Host "===== $($_.FullName)"
              Get-Content $_.FullName -Tail 60
            }

      - name: vcpkg-Cache speichern
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/toolchains/**') }}

      - name: Bauen
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Portablen Ordner zusammenstellen
        run: |
          $dist = "dist/step-brother-m0-${{ matrix.preset }}"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/${{ matrix.preset }}/bin/*.exe $dist
          Copy-Item build/${{ matrix.preset }}/vcpkg_installed/${{ matrix.triplet }}/bin/*.dll $dist
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.txt, README.md $dist
          if ('${{ matrix.toolchain }}' -eq 'msvc') {
            # C++-Laufzeit beilegen, damit kein VC++-Redistributable installiert sein muss
            Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" | Copy-Item -Destination $dist
          } else {
            # Alle MinGW-Laufzeit-DLLs einsammeln, die exe und DLLs (rekursiv) brauchen
            $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
            $objdump = Join-Path $bin 'objdump.exe'
            do {
              $added = 0
              $needed = Get-ChildItem $dist -Include *.exe, *.dll -Recurse | ForEach-Object {
                & $objdump -p $_.FullName | Select-String 'DLL Name:\s*(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
              } | Sort-Object -Unique
              foreach ($dll in $needed) {
                $src = Join-Path $bin $dll
                if ((Test-Path $src) -and -not (Test-Path (Join-Path $dist $dll))) {
                  Copy-Item $src $dist; $added++; Write-Host "MinGW-Laufzeit: $dll"
                }
              }
            } while ($added -gt 0)
          }
          Get-ChildItem $dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Rauchtest mit synthetischer Anlage
        # Fehlt eine DLL, zeigt Windows einen Dialog und der Prozess wartet ewig - daher Zeitlimit.
        timeout-minutes: 5
        run: |
          $dist = "dist/step-brother-m0-${{ matrix.preset }}"
          # Ohne MSYS2/VS im PATH testen, damit fehlende DLLs auffallen
          $env:PATH = "$((Resolve-Path $dist).Path);C:\Windows\System32;C:\Windows"
          & "$dist/sb-gen-step.exe" test.stp --grid 5 --holes 3 --force
          if ($LASTEXITCODE -ne 0) { throw "sb-gen-step fehlgeschlagen" }
          & "$dist/sb-bench.exe" test.stp --json bench.json
          if ($LASTEXITCODE -ne 0) { throw "sb-bench fehlgeschlagen" }
          $r = Get-Content bench.json | ConvertFrom-Json
          if ($r.structure.prototypes -ne 3) { throw "Erwartet 3 Prototypen, gefunden $($r.structure.prototypes)" }
          if ($r.structure.part_instances -ne 175) { throw "Erwartet 175 Instanzen, gefunden $($r.structure.part_instances)" }
          Get-Content bench.json
          # Datei ohne 2D-Randkurven (wie manche CAD-Exporte): eigenes Healing muss sie reparieren
          & "$dist/sb-gen-step.exe" nopc.stp --grid 5 --holes 3 --no-pcurves --force
          if ($LASTEXITCODE -ne 0) { throw "sb-gen-step --no-pcurves fehlgeschlagen" }
          foreach ($mode in 'pcurves', 'parallel') {
            & "$dist/sb-bench.exe" nopc.stp --healing $mode --deflection 0.003 --json "nopc-$mode.json"
            if ($LASTEXITCODE -ne 0) { throw "sb-bench --healing $mode fehlgeschlagen" }
            $m = (Get-Content "nopc-$mode.json" | ConvertFrom-Json).mesh[0]
            if ($m.faces_without_mesh -ne 0) { throw "--healing ${mode}: $($m.faces_without_mesh) Flaechen ohne Netz" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: step-brother-m0-${{ matrix.preset }}
          path: dist/step-brother-m0-${{ matrix.preset }}
          retention-days: 30
